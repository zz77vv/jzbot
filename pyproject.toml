[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jzbot"
version = "4.0.0"
description = "Clean-slate Telegram Business USDT bookkeeping bot"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot==22.8",
]

[tool.setuptools.packages.find]
include = ["jzbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
